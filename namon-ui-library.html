<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Namon Desk · UI Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;700&family=Poppins:wght@600;800&display=swap" rel="stylesheet">

<style>
  body { margin: 0; }
  .ui { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: var(--nd-space-600, 24px); max-width: 1280px; margin: 0 auto; padding: var(--nd-space-400, 16px); align-items: start; }
  .ui-side { position: sticky; top: var(--nd-space-400, 16px); display: grid; gap: var(--nd-space-300, 12px); max-height: calc(100dvh - 32px); overflow: auto; }
  .ui-list { display: grid; gap: var(--nd-space-100, 4px); margin: 0; padding: 0; list-style: none; }
  .ui-list button { width: 100%; min-height: var(--nd-control-h, 44px); padding: 0 var(--nd-space-300, 12px); border: 0; border-radius: var(--nd-radius-200, 8px); background: none; color: var(--nd-text-secondary, #636B72); font: inherit; font-size: var(--nd-type-size-sm, 14px); text-align: left; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .ui-list button:hover { background: var(--nd-surface-brand-quiet, #F0F7FF); color: var(--nd-text-default, #363B3F); }
  .ui-list button[aria-current="true"] { background: var(--nd-surface-brand-quiet, #F0F7FF); color: var(--nd-text-brand, #1B5FC1); font-weight: var(--nd-type-weight-medium, 500); }
  .ui-list button:focus-visible { outline: var(--nd-stroke-200, 2px) solid var(--nd-border-brand, #1B5FC1); outline-offset: -2px; }
  .ui-list small { color: var(--nd-text-tertiary, #6A727A); }
  .ui-main { display: grid; gap: var(--nd-space-600, 24px); min-width: 0; }
  .ui-head { display: flex; flex-wrap: wrap; gap: var(--nd-space-300, 12px); align-items: center; justify-content: space-between; }
  .ui-head h1 { margin: 0; font-family: var(--nd-type-family-heading, 'Poppins', 'Sarabun', system-ui, sans-serif); font-weight: 800; font-size: clamp(24px, 4vw, 36px); }
  .ui-stage { padding: var(--nd-space-400, 16px); border: var(--nd-stroke-100, 1px) solid var(--nd-border-quiet, #F4F5F5); border-radius: var(--nd-radius-300, 10px); background: var(--nd-surface-card, #FFFFFF); }
  .ui-ex { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--nd-space-300, 12px); }
  .ui-ex + .ui-ex { margin-top: var(--nd-space-600, 24px); padding-top: var(--nd-space-600, 24px); border-top: var(--nd-stroke-100, 1px) solid var(--nd-border-quiet, #F4F5F5); }
  .ui-ex h3 { margin: 0; }
  pre.ui-code { margin: 0; padding: var(--nd-space-300, 12px); border-radius: var(--nd-radius-200, 8px); background: var(--nd-surface-neutral, #F4F5F5); color: var(--nd-text-default, #363B3F); font: 12px/1.6 ui-monospace, Menlo, monospace; overflow-x: auto; white-space: pre; }
  .ui-codewrap { position: relative; min-width: 0; }
  .ui-main > section { min-width: 0; }
  .ui-stage { min-width: 0; overflow-x: auto; }
  .ui-codewrap .nd-btn { position: absolute; top: 6px; right: 6px; min-height: 32px; padding: 0 10px; font-size: 12px; background: var(--nd-surface-card, #FFFFFF); }
  table.ui-tbl { width: 100%; border-collapse: collapse; font-size: var(--nd-type-size-sm, 14px); }
  table.ui-tbl td, table.ui-tbl th { padding: 8px 10px; border-bottom: var(--nd-stroke-100, 1px) solid var(--nd-border-quiet, #F4F5F5); text-align: left; vertical-align: top; overflow-wrap: anywhere; }
  table.ui-tbl th { color: var(--nd-text-tertiary, #6A727A); font-weight: var(--nd-type-weight-medium, 500); font-size: var(--nd-type-size-xs, 12px); }
  .ui code { font-size: 12px; background: var(--nd-surface-neutral, #F4F5F5); padding: 2px 6px; border-radius: 4px; }
  .ui-scroll { overflow-x: auto; }
  .ui-states { display: flex; flex-wrap: wrap; gap: var(--nd-space-400, 16px); align-items: flex-start; }
  .ui-states > div { display: grid; gap: 6px; justify-items: start; font-size: var(--nd-type-size-xs, 12px); color: var(--nd-text-tertiary, #6A727A); }
  @media (max-width: 899px) {
    .ui { grid-template-columns: minmax(0, 1fr); }
    .ui-side { position: static; max-height: none; }
    .ui-list { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
    .ui-list button { width: auto; white-space: nowrap; border: var(--nd-stroke-100, 1px) solid var(--nd-border-quiet, #F4F5F5); }
    .ui-list small { display: none; }
  }
</style>

  var css = ':root {\n', bars = Object.keys(COLORS).map(function (k) { var sc = ramp(COLORS[k]); 
    css += Object.keys(sc).map(function (n) { return '  --nd-' + ROLES[k] + '-' + n + ': ' + sc[n] + ';'; }).join('\n') + '\n';
    return '<div style="margin-bottom:20px"><h3 class="nd-title" style="margin:0 0 8px">' + k + ' · <code>--nd-' + ROLES[k] + '-*</code></h3><div class="ui-scroll"><div style="display:grid;grid-template-columns:repeat(10,minmax(84px,1fr));gap:6px;min-width:860px">' + Object.keys(sc).map(function (n) { var hex = sc[n], w = cr(hex, '#FFFFFF'), b = cr(hex, '#0D121A'), onC = w >= b ? '#FFFFFF' : '#0D121A', best = Math.max(w, b);
      return '<div style="border:1px solid var(--nd-border-quiet,#F4F5F5);border-radius:8px;overflow:hidden;background:var(--nd-surface-card,#fff);font-size:11px"><div style="height:56px;background:' + hex + ';color:' + onC + ';display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px">Aa</div><div style="padding:6px 8px;display:grid;gap:2px"><b>' + n + '</b><span>' + hex + '</span><span style="color:var(--nd-text-tertiary,#6A727A)">ขาว ' + w.toFixed(1) + (w >= 4.5 ? ' ✓' : '') + '</span><span style="color:var(--nd-text-tertiary,#6A727A)">มืด ' + b.toFixed(1) + (b >= 4.5 ? ' ✓' : '') + '</span></div></div>'; }).join('') + '</div></div></div>'; }).join('');
  css += '}';
  var c = C[0];
  document.getElementById('main').innerHTML =
    '<div class="ui-head"><div><h1>Color</h1><p class="nd-summary">' + c.th + ' · ' + esc(c.sum) + '</p></div><button class="nd-btn" id="theme" type="button" aria-pressed="' + dark + '">' + (dark ? 'โหมดสว่าง' : 'โหมดมืด') + '</button></div>' +
    '<section><h2 class="nd-title" style="margin-bottom:8px">ใส่สีหลัก</h2><div class="nd-fields" style="--nd-grid-min:320px">' + inputs + '</div></section>' +
    '<section><h2 class="nd-title" style="margin-bottom:8px">สเกลสีตามระดับ token</h2><p class="nd-summary" style="margin-bottom:12px">เลขยิ่งน้อยยิ่งอ่อน (พื้นหลัง) · 500 = สีหลัก · 600–900 เข้มขึ้น (ข้อความ/ขอบ) · “ขาว/มืด” = contrast ของข้อความสีขาว/สีมืดบนช่องสีนั้น (✓ = ผ่าน 4.5:1)</p><div class="ui-stage">' + bars + '</div></section>' +
    '<section><h2 class="nd-title" style="margin-bottom:8px">CSS token (Primitive)</h2><div class="ui-codewrap"><button class="nd-btn" type="button" data-copy>คัดลอก</button><pre class="ui-code">' + esc(css) + '</pre></div></section>' +
    '<section><h2 class="nd-title" style="margin-bottom:8px">คลาสและชั้น token</h2><div class="ui-scroll"><table class="ui-tbl"><thead><tr><th>token</th><th>ใช้เมื่อ</th></tr></thead><tbody>' + c.cls.map(function (r) { return '<tr><td><code>' + esc(r[0]) + '</code></td><td>' + esc(r[1]) + '</td></tr>'; }).join('') + '</tbody></table></div></section>';
}

function esc(s) { return String(s).replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; }); }
function list() {
  var f = C.filter(function (c) { return (c.name + ' ' + c.th + ' ' + c.id).toLowerCase().indexOf(q.toLowerCase()) >= 0; });
  document.getElementById('list').innerHTML = f.map(function (c) { return '<li><button type="button" data-id="' + c.id + '" aria-current="' + (c.id === cur) + '">' + c.name + '<small>' + c.th + '</small></button></li>'; }).join('') || '<li class="nd-summary">ไม่พบ</li>';
}
function view() {
  var c = C.filter(function (x) { return x.id === cur; })[0]; if (!c) return;
  if (c.custom) { colorView(); return; }
  var ex = c.ex.map(function (e) {
    var html = e.html || e.states.map(function (s) { return s[0]; }).join('\n');
    var liveHtml = (e.html || '').replace(/<script[\s\S]*?<\/script>/g, '').trim();
    var live = e.states ? '<div class="ui-states">' + e.states.map(function (s) { return '<div>' + s[0] + s[1] + '</div>'; }).join('') + '</div>' : liveHtml;
    return '<div class="ui-ex"><h3 class="nd-title">' + e.t + '</h3><div class="ui-stage">' + live + '</div><div class="ui-codewrap"><button class="nd-btn" type="button" data-copy>คัดลอก</button><pre class="ui-code">' + esc(html) + '</pre></div></div>';
  }).join('');
  var cls = '<div class="ui-scroll"><table class="ui-tbl"><thead><tr><th>คลาส</th><th>ใช้เมื่อ</th></tr></thead><tbody>' + c.cls.map(function (r) { return '<tr><td><code>' + esc(r[0]) + '</code></td><td>' + esc(r[1]) + '</td></tr>'; }).join('') + '</tbody></table></div>';
  var tok = '<div class="nd-row">' + c.tok.map(function (t) { return '<code>' + esc(t) + '</code>'; }).join('') + '</div>';
  document.getElementById('main').innerHTML =
    '<div class="ui-head"><div><h1>' + c.name + '</h1><p class="nd-summary">' + c.th + ' · ' + esc(c.sum) + '</p></div><button class="nd-btn" id="theme" type="button" aria-pressed="false">โหมดมืด</button></div>' +
    '<section><h2 class="nd-title" style="margin-bottom:8px">ตัวอย่างและโค้ด</h2>' + ex + '</section>' +
    '<section><h2 class="nd-title" style="margin-bottom:8px">คลาส</h2>' + cls + '</section>' +
    '<section><h2 class="nd-title" style="margin-bottom:8px">Token ที่ใช้</h2>' + tok + '</section>';
  var dark = document.documentElement.getAttribute('data-theme') === 'dark', b = document.getElementById('theme'); b.textContent = dark ? 'โหมดสว่าง' : 'โหมดมืด'; b.setAttribute('aria-pressed', String(dark));
  [].forEach.call(document.querySelectorAll('.nd-tabs'), function (t) { t.addEventListener('click', function (e) { var b = e.target.closest('.nd-tab'); if (!b) return; [].forEach.call(t.children, function (x) { x.setAttribute('aria-selected', String(x === b)); }); }); });
}
document.addEventListener('click', function (e) {
  var b = e.target.closest('[data-id]'); if (b) { cur = b.dataset.id; list(); view(); history.replaceState(null, '', '#' + cur); return; }
  if (e.target.closest('#theme')) { var r = document.documentElement; r.setAttribute('data-theme', r.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'); view(); return; }
  var cp = e.target.closest('[data-copy]'); if (cp) { var t = cp.parentNode.querySelector('pre').textContent; try { navigator.clipboard.writeText(t); cp.textContent = 'คัดลอกแล้ว'; setTimeout(function () { cp.textContent = 'คัดลอก'; }, 1200); } catch (x) {} }
});
document.addEventListener('input', function (e) { var t = e.target, k = t.dataset && (t.dataset.ck || t.dataset.ch || t.dataset.cn); if (!k) return;
  if (t.dataset.cn) { var v = t.value.replace(/[^a-z0-9-]/gi, '').toLowerCase(); if (v) { ROLES[k] = v; } } else { if (!/^#[0-9a-fA-F]{6}$/.test(t.value)) return; COLORS[k] = t.value.toUpperCase(); }
  var f = document.activeElement, key = f && (f.dataset.ck || f.dataset.ch || f.dataset.cn) ? Object.keys(f.dataset)[0] + '=' + (f.dataset.ck || f.dataset.ch || f.dataset.cn) : null, pos = f && f.selectionStart; colorView();
  if (key) { var sel = document.querySelector('[data-' + key.split('=')[0].replace(/[A-Z]/g, function (m) { return '-' + m.toLowerCase(); }) + '="' + key.split('=')[1] + '"]'); if (sel && sel.type !== 'color') { sel.focus(); try { sel.setSelectionRange(pos, pos); } catch (x) {} } } });
document.getElementById('q').addEventListener('input', function (e) { q = e.target.value; list(); });
var h = location.hash.slice(1); if (C.some(function (c) { return c.id === h; })) cur = h;
if (matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.setAttribute('data-theme', 'dark');
list(); view();
</script>
