<!doctype html>
<html lang="th" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PHCIS · User Flow สำหรับ Dev — เข้าสู่ระบบ · จัดการระบบ · ความยินยอม</title>
<!-- ใช้ token จาก mirror ของ @mih/design-tokens · เปิดผ่าน file:// ได้ (path relative) -->
<link rel="stylesheet" href="tokens.css" />
<style>
  :root {
    --c-text: var(--text-content-default, #363B3F);
    --c-text-2: var(--text-content-secondary, #636B72);
    --c-text-3: var(--text-content-tertiary, #858C92);
    --c-bg: var(--surface-neutral-quaternary, #F9FBFB);
    --c-card: var(--surface-neutralButton-quinary, #FFFFFF);
    --c-line: var(--border-neutral-tertiary, #E2E4E6);
    --c-line-2: var(--border-neutralButton-quaternary, #F4F5F5);
    --c-brand: var(--brand-p700, #007549);
    --c-brand-soft: var(--brand-p50, #F4FBF8);
    --c-brand-mid: var(--brand-p100, #E2F3EB);
    --c-danger: var(--text-danger-default, #B91C1C);
    --c-danger-soft: var(--surface-danger-tertiary, #FEE2E2);
    --c-info: var(--text-info-default, #1D4ED8);
    --c-info-soft: var(--surface-info-tertiary, #DBEAFE);
    --c-warn: var(--text-warning-default, #C2410C);
    --c-neutral-soft: var(--surface-neutral-tertiary, #F4F5F5);
    --sp-1: var(--dim-space-100, 4px);
    --sp-2: var(--dim-space-200, 8px);
    --sp-3: var(--dim-space-300, 12px);
    --sp-4: var(--dim-space-400, 16px);
    --sp-5: var(--dim-space-500, 20px);
    --sp-6: var(--dim-space-600, 24px);
    --sp-8: var(--dim-space-800, 32px);
    --r-2: var(--dim-radius-200, 8px);
    --r-4: var(--dim-radius-400, 12px);
    --r-5: var(--dim-radius-500, 16px);
    --r-full: var(--dim-radius-full, 9999px);
    --fs-xxs: var(--type-size-xxs, 10px);
    --fs-xs: var(--type-size-xs, 12px);
    --fs-sm: var(--type-size-sm, 14px);
    --fs-base: var(--type-size-base, 16px);
    --fs-lg: var(--type-size-lg, 18px);
    --fs-xl: var(--type-size-xl, 20px);
    --fs-2xl: var(--type-size-2xl, 24px);
    --fw-r: var(--type-weight-regular, 400);
    --fw-m: var(--type-weight-medium, 500);
    --fw-b: var(--type-weight-bold, 700);
    --sh: var(--shadow-dropdown, 0 4px 16px rgba(15, 23, 42, .12));
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--c-bg); color: var(--c-text); }
  body {
    font-family: "IBM Plex Sans Thai", "Sarabun", "Noto Sans Thai", -apple-system, "Segoe UI", system-ui, sans-serif;
    font-size: var(--fs-sm); line-height: 1.55;
  }
  button { font: inherit; color: inherit; }
  a { color: var(--c-brand); }
  code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: var(--fs-xs); }

  /* ── header ── */
  .top {
    position: sticky; top: 0; z-index: 20;
    background: var(--c-card); border-bottom: 1px solid var(--c-line);
    padding: var(--sp-4) var(--sp-6) 0;
  }
  .top h1 { margin: 0; font-size: var(--fs-xl); font-weight: var(--fw-b); color: var(--c-brand); }
  .top .sub { margin: var(--sp-1) 0 var(--sp-3); color: var(--c-text-2); font-size: var(--fs-xs); }
  .tabs { display: flex; gap: var(--sp-1); overflow-x: auto; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex: 0 0 auto; min-height: 44px; padding: 0 var(--sp-4);
    border: 0; background: none; cursor: pointer; color: var(--c-text-2);
    border-bottom: 2px solid transparent; font-weight: var(--fw-m);
  }
  .tab[aria-selected="true"] { color: var(--c-brand); border-bottom-color: var(--c-brand); }
  .tab .n { margin-left: var(--sp-1); font-size: var(--fs-xs); color: var(--c-text-3); }

  main { max-width: 1600px; margin: 0 auto; padding: var(--sp-6); }
  .intro {
    display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--sp-4); align-items: start;
    background: var(--c-card); border: 1px solid var(--c-line); border-radius: var(--r-4);
    padding: var(--sp-4) var(--sp-5); margin-bottom: var(--sp-6);
  }
  .intro h2 { margin: 0 0 var(--sp-1); font-size: var(--fs-base); font-weight: var(--fw-b); }
  .intro p { margin: 0; color: var(--c-text-2); font-size: var(--fs-xs); }
  .legend { display: flex; flex-wrap: wrap; gap: var(--sp-2) var(--sp-4); font-size: var(--fs-xs); color: var(--c-text-2); }
  .legend span { display: inline-flex; align-items: center; gap: var(--sp-1); }
  .dot { width: 10px; height: 10px; border-radius: var(--r-full); display: inline-block; }

  /* ── flow ── */
  .flow { display: flex; flex-direction: column; gap: var(--sp-6); }
  .lane { background: var(--c-card); border: 1px solid var(--c-line); border-radius: var(--r-4); padding: var(--sp-4); }
  .lane-h { display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--sp-2); margin-bottom: var(--sp-3); }
  .lane-h h3 { margin: 0; font-size: var(--fs-base); font-weight: var(--fw-b); }
  .lane-h .who { font-size: var(--fs-xs); color: var(--c-text-2); }
  .phases { display: flex; align-items: stretch; gap: 0; overflow-x: auto; padding-bottom: var(--sp-2); }
  .phase { flex: 0 0 236px; display: flex; flex-direction: column; gap: var(--sp-3); }
  .phase-h { font-size: var(--fs-xs); font-weight: var(--fw-m); color: var(--c-text-3); min-height: 20px; }
  .arrow { flex: 0 0 32px; display: flex; align-items: center; justify-content: center; color: var(--c-text-3); font-size: var(--fs-lg); padding-top: 20px; }

  .node {
    position: relative; display: block; width: 100%; text-align: left; cursor: pointer;
    background: var(--c-card); border: 1px solid var(--c-line); border-radius: var(--r-4);
    padding: 0; overflow: hidden; transition: border-color .15s, box-shadow .15s, transform .15s;
  }
  .node:hover, .node:focus-visible { border-color: var(--c-brand); box-shadow: var(--sh); outline: none; transform: translateY(-1px); }
  .node.active { border-color: var(--c-brand); box-shadow: 0 0 0 2px var(--c-brand-mid); }
  .node .thumb { aspect-ratio: 16 / 10; background: var(--c-neutral-soft); border-bottom: 1px solid var(--c-line); overflow: hidden; }
  .node .thumb img { width: 100%; height: 100%; object-fit: cover; object-position: top center; display: block; }
  .node .thumb.none { display: flex; align-items: center; justify-content: center; color: var(--c-text-3); font-size: var(--fs-xs); }
  .node .body { padding: var(--sp-2) var(--sp-3) var(--sp-3); }
  .node .no { font-size: var(--fs-xxs); font-weight: var(--fw-b); color: var(--c-brand); letter-spacing: .3px; }
  .node .t { font-weight: var(--fw-m); font-size: var(--fs-sm); line-height: 1.35; margin: 2px 0; }
  .node .r { font-size: var(--fs-xxs); color: var(--c-text-3); font-family: ui-monospace, Menlo, monospace; word-break: break-all; }
  .node .badges { display: flex; flex-wrap: wrap; gap: var(--sp-1); margin-top: var(--sp-2); }
  .node.alt { border-style: dashed; }
  .b { display: inline-flex; align-items: center; gap: 2px; padding: 0 var(--sp-2); border-radius: var(--r-full); font-size: var(--fs-xxs); font-weight: var(--fw-m); line-height: 18px; white-space: nowrap; }
  .b.cond { background: var(--c-info-soft); color: var(--c-info); }
  .b.gap { background: var(--c-danger-soft); color: var(--c-danger); }
  .b.shots { background: var(--c-brand-mid); color: var(--c-brand); }
  .b.alt { background: var(--c-neutral-soft); color: var(--c-text-2); }

  /* ── hover preview (desktop pointer only) ── */
  .peek {
    position: fixed; z-index: 40; width: 440px; max-width: calc(100vw - 24px); pointer-events: none;
    background: var(--c-card); border: 1px solid var(--c-line); border-radius: var(--r-4); box-shadow: var(--sh);
    padding: var(--sp-3); opacity: 0; transition: opacity .12s;
  }
  .peek.on { opacity: 1; }
  .peek img { width: 100%; border-radius: var(--r-2); border: 1px solid var(--c-line); display: block; }
  .peek .pt { margin-top: var(--sp-2); font-size: var(--fs-sm); font-weight: var(--fw-m); }
  .peek .ps { font-size: var(--fs-xs); color: var(--c-text-2); }
  .peek hr { border: 0; border-top: 1px solid var(--border-neutral-quaternary, #F4F5F5); margin: var(--sp-2) 0; }
  .peek .kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 2px var(--sp-3); font-size: var(--fs-xs); }
  .peek .kv dt { color: var(--c-text-3); }
  .peek .kv dd { margin: 0; color: var(--c-text); }
  .peek .hint { margin-top: var(--sp-2); font-size: var(--fs-xxs); color: var(--c-text-3); }

  /* ── drawer ── */
  .scrim { position: fixed; inset: 0; background: rgba(23, 26, 31, .32); z-index: 50; opacity: 0; pointer-events: none; transition: opacity .2s; }
  .scrim.on { opacity: 1; pointer-events: auto; }
  .drawer {
    position: fixed; top: 0; right: 0; bottom: 0; z-index: 60; width: min(880px, 100vw);
    background: var(--c-card); box-shadow: var(--sh); transform: translateX(100%); transition: transform .22s ease;
    display: flex; flex-direction: column;
  }
  .drawer.on { transform: none; }
  .d-head { display: flex; align-items: flex-start; gap: var(--sp-3); padding: var(--sp-4) var(--sp-5); border-bottom: 1px solid var(--c-line); }
  .d-head .ttl { flex: 1; min-width: 0; }
  .d-head .no { font-size: var(--fs-xs); font-weight: var(--fw-b); color: var(--c-brand); }
  .d-head h2 { margin: 2px 0 var(--sp-1); font-size: var(--fs-lg); font-weight: var(--fw-b); color: var(--c-text); }
  .d-head .sum { font-size: var(--fs-xs); color: var(--c-text-2); }
  .iconbtn { flex: 0 0 auto; width: 44px; height: 44px; border-radius: var(--r-full); border: 1px solid var(--c-line); background: var(--c-card); cursor: pointer; font-size: var(--fs-lg); line-height: 1; }
  .iconbtn:hover { background: var(--c-neutral-soft); }
  .d-nav { display: flex; gap: var(--sp-2); padding: var(--sp-2) var(--sp-5); border-bottom: 1px solid var(--c-line); flex-wrap: wrap; }
  .pill { min-height: 36px; padding: 0 var(--sp-3); border-radius: var(--r-full); border: 1px solid var(--c-line); background: var(--c-card); cursor: pointer; font-size: var(--fs-xs); }
  .pill:hover { border-color: var(--c-brand); color: var(--c-brand); }
  .pill[disabled] { opacity: .4; cursor: default; }
  .d-body { flex: 1; overflow-y: auto; padding: var(--sp-5); display: flex; flex-direction: column; gap: var(--sp-6); }
  .meta { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: var(--sp-2) var(--sp-4); font-size: var(--fs-xs); }
  .meta dt { color: var(--c-text-3); }
  .meta dd { margin: 0; word-break: break-word; }

  .gallery .main { position: relative; border: 1px solid var(--c-line); border-radius: var(--r-4); overflow: hidden; background: var(--c-neutral-soft); cursor: zoom-in; }
  .gallery .main img { width: 100%; display: block; }
  .gallery .cap { margin-top: var(--sp-2); font-size: var(--fs-xs); color: var(--c-text-2); }
  .variants { display: flex; flex-wrap: wrap; gap: var(--sp-2); margin-bottom: var(--sp-3); }
  .variants .pill[aria-pressed="true"] { background: var(--c-brand); border-color: var(--c-brand); color: var(--surface-neutralButton-quinary, #FFFFFF); }

  .sec h4 { margin: 0 0 var(--sp-1); font-size: var(--fs-sm); font-weight: var(--fw-b); color: var(--c-text); }
  .sec .hint { margin: 0 0 var(--sp-3); font-size: var(--fs-xs); color: var(--c-text-3); }
  .sec ul { margin: 0; padding-left: var(--sp-5); display: flex; flex-direction: column; gap: var(--sp-1); }
  .sec li { font-size: var(--fs-sm); }
  .tbl-wrap { overflow-x: auto; border: 1px solid var(--c-line); border-radius: var(--r-2); }
  table { width: 100%; border-collapse: collapse; font-size: var(--fs-xs); }
  th, td { text-align: left; vertical-align: top; padding: var(--sp-2) var(--sp-3); border-bottom: 1px solid var(--c-line-2); }
  th { background: var(--c-neutral-soft); font-weight: var(--fw-m); color: var(--c-text-2); white-space: nowrap; }
  tr:last-child td { border-bottom: 0; }
  td .go { display: inline-flex; align-items: center; min-height: 28px; padding: 0 var(--sp-2); border-radius: var(--r-full); border: 1px solid var(--c-brand-mid); background: var(--c-brand-soft); color: var(--c-brand); cursor: pointer; font-size: var(--fs-xxs); font-weight: var(--fw-m); white-space: nowrap; }
  .gaps { background: var(--c-danger-soft); border-radius: var(--r-2); padding: var(--sp-3) var(--sp-4); }
  .gaps h4 { color: var(--c-danger); }
  .q { color: var(--c-brand); }

  /* ── lightbox ── */
  .lb { position: fixed; inset: 0; z-index: 80; background: rgba(23, 26, 31, .86); display: none; align-items: center; justify-content: center; padding: var(--sp-6); cursor: zoom-out; }
  .lb.on { display: flex; }
  .lb img { max-width: 100%; max-height: 100%; border-radius: var(--r-2); }

  /* ── responsive ── */
  @media (max-width: 1023px) {
    main { padding: var(--sp-4); }
    .phase { flex-basis: 210px; }
  }
  @media (max-width: 767px) {
    .top { padding: var(--sp-3) var(--sp-4) 0; }
    .top h1 { font-size: var(--fs-base); }
    .intro { grid-template-columns: 1fr; }
    .phases { flex-direction: column; overflow: visible; }
    .phase { flex: 0 0 auto; }
    .phase .nodes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--sp-3); }
    .arrow { padding: 0; transform: rotate(90deg); flex-basis: 28px; }
    .d-head, .d-body { padding-left: var(--sp-4); padding-right: var(--sp-4); }
    .meta { grid-template-columns: 1fr; gap: 0; }
    .meta dt { margin-top: var(--sp-2); }
  }
  @media (max-width: 767px) {
    .ct thead { display: none; }
    .ct tr { display: grid; grid-template-columns: 1fr; padding: var(--sp-2) 0; border-bottom: 1px solid var(--c-line-2); }
    .ct td { border: 0; padding: 2px var(--sp-3); }
    .ct td:first-child { font-weight: var(--fw-m); }
    .ct td:last-child:empty, .ct td:last-child:not(:has(button)) { display: none; }
  }
  @media (max-width: 420px) {
    .phase .nodes { grid-template-columns: 1fr; }
  }
  .phase .nodes { display: flex; flex-direction: column; gap: var(--sp-3); }
  @media (max-width: 767px) { .phase .nodes { display: grid; } }
</style>
</head>
<body>
<header class="top">
  <h1>User Flow สำหรับ Dev · เข้าสู่ระบบ · จัดการระบบ · ความยินยอม</h1>
  <p class="sub">ถอดจากโค้ดจริงใน bma.health (Kae-Branch · 13 ต.ค. 69) · ภาพหน้าจอจากแอปที่รันอยู่ · ชี้ที่ขั้นเพื่อดูตัวอย่างหน้าจอ · กดเพื่อดูรายละเอียดและเงื่อนไขทั้งหมด</p>
  <nav class="tabs" role="tablist" id="tabs"></nav>
</header>
<main>
  <section class="intro" id="intro"></section>
  <div class="flow" id="flow"></div>
</main>

<div class="peek" id="peek" aria-hidden="true"></div>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="d-title">
  <div class="d-head">
    <div class="ttl"><div class="no" id="d-no"></div><h2 id="d-title"></h2><div class="sum" id="d-sum"></div></div>
    <button class="iconbtn" id="d-close" aria-label="ปิด">×</button>
  </div>
  <div class="d-nav"><button class="pill" id="d-prev">← ขั้นก่อนหน้า</button><button class="pill" id="d-next">ขั้นถัดไป →</button></div>
  <div class="d-body" id="d-body"></div>
</aside>
<div class="lb" id="lb"><img alt="" id="lb-img" /></div>

<script>
/* ════════════════════════════════════════════════════════════════════════
   DATA — แต่ละขั้น: route · ใครใช้ · ไฟล์ · ภาพ (หลายสถานะ) · องค์ประกอบหน้าจอ ·
   การกระทำ → ผลลัพธ์ · เงื่อนไข (if → then → ไปขั้นไหน) · ข้อความ validation ·
   ที่เก็บข้อมูล · ข้อสังเกตจากโค้ด (gap/bug ที่ dev ต้องรู้)
   ════════════════════════════════════════════════════════════════════════ */
const S = (f) => 'flow-shots/' + f + '.jpg';

const MODULES = [
/* ───────────────────────────── 1. เข้าสู่ระบบ ───────────────────────────── */
{
  key: 'login', label: 'เข้าสู่ระบบ',
  title: 'การเข้าสู่ระบบ (Login)',
  summary: 'เจ้าหน้าที่ทุกบทบาท · ล็อกอิน → ยืนยันตัวตน 2 ชั้น → (ตั้งรหัสผ่าน) → เลือกศูนย์ → หน้าหลักตามบทบาท',
  lanes: [{
    title: 'เส้นทางหลักของเจ้าหน้าที่', who: 'ทุกบทบาท · ไฟล์หลัก src/pages/auth/*',
    phases: [
      { h: '1 · ลงชื่อเข้าใช้', nodes: ['L1', 'L1S'] },
      { h: '2 · ยืนยันตัวตน 2 ชั้น', nodes: ['L2'] },
      { h: '3 · ตั้งรหัสผ่าน (บางกรณี)', nodes: ['L3'] },
      { h: '4 · เลือกศูนย์บริการ', nodes: ['L4'] },
      { h: '5 · เข้าหน้าหลัก', nodes: ['L5', 'L6'] },
    ],
  }],
},
/* ───────────────────────────── 2. จัดการระบบ ───────────────────────────── */
{
  key: 'admin', label: 'การจัดการระบบ',
  title: 'การจัดการระบบ (ตั้งค่าองค์กร · ผู้ใช้ · สิทธิ์)',
  summary: 'ผู้ดูแลระบบส่วนกลาง / ศูนย์ · ลำดับตั้งค่าจริง: หน่วยงาน → คลินิก/แผนก → ตำแหน่ง → บทบาท → แม่แบบสิทธิ์ → บุคลากร → อนุมัติ',
  lanes: [{
    title: 'ตั้งค่าโครงสร้างและสิทธิ์', who: 'admin_super (ส่วนกลาง) · center_admin (ศูนย์)',
    phases: [
      { h: '0 · เข้าระบบจัดการระบบ', nodes: ['A0', 'A1'] },
      { h: '1 · หน่วยงาน/พื้นที่', nodes: ['A2', 'A3', 'A8'] },
      { h: '2 · ตำแหน่ง · บทบาท', nodes: ['A4', 'A5'] },
      { h: '3 · สิทธิ์การเข้าถึง', nodes: ['A6', 'A9'] },
      { h: '4 · บุคลากร', nodes: ['A7', 'A7N', 'A7D'] },
      { h: '5 · อนุมัติ', nodes: ['A10'] },
    ],
  }],
},
/* ───────────────────────────── 3. ความยินยอม ───────────────────────────── */
{
  key: 'consent', label: 'ระบบการจัดการความยินยอม',
  title: 'ระบบการจัดการความยินยอม (Consent Management)',
  summary: '3 กลุ่มผู้ใช้: ผู้ดูแล (ตั้งแบบฟอร์ม/อนุมัติ) · เจ้าหน้าที่ (ขอ/บันทึก/เพิกถอน) · ผู้ขอสิทธิ์ · และจุดที่ความยินยอมถูกเก็บระหว่างเส้นทางผู้ป่วย',
  lanes: [
    {
      title: 'ผู้ดูแลระบบ — ตั้งแบบฟอร์มและกำกับสิทธิ์', who: 'admin_super เท่านั้นที่เข้า /consent/* ได้',
      phases: [
        { h: '1 · ภาพรวม', nodes: ['C1'] },

  file: 'src/components/clinic/ClinicConsentFormsStep.jsx · src/data/clinicConsentForms.js · consentWorkflowStore.js (gateCpoeOrder)',
  summary: 'แต่ละคลินิกมีแบบฟอร์มของตัวเอง “เฉพาะการมาตรวจครั้งนี้”',
  shots: [],

    ['สั่งยา (ออกแบบไว้)', 'ต้องมี PDPA หรือการรักษาที่มีผล · วิจัยต้องมีการวิจัย · ผ่าตัดต้องมีผ่าตัด', null],
    ['รับยาทางไปรษณีย์ / จุดรับ ครั้งแรก', 'ขอความยินยอมต่อ HN ต่อวิธี · ไม่ยินยอม = ใช้วิธีนี้ไม่ได้', null],
  ],
  errors: [], store: ['form.clinicConsent[formId] ในฟอร์มของ visit — ไม่อยู่ใน store กลาง'],
  gaps: ['ด่านสั่งยา (gateCpoeOrder) ยังไม่ผูกกับปุ่มใด จึงยังไม่ทำงาน', 'ความยินยอมระดับคลินิกไม่ขึ้นใน /consent'], next: ['P3'],

  title: 'ข้อมูลข้ามศูนย์ (ADD-C4) และการส่งต่อภายนอก', route: 'ห้องตรวจ · ผลแล็บ/รังสี · ป๊อปอัปส่งต่อ', who: 'แพทย์ · พยาบาล',
  file: 'src/data/crossCenterConsent.js · InternalReferPopup.jsx',
  summary: 'ไม่มีความยินยอม = ข้อมูลศูนย์อื่นถูกซ่อน / ส่งต่อออกนอกสำนักอนามัยไม่ได้',
  shots: [],
  screen: ['แถบ “มีข้อมูลจากศูนย์อื่นที่ยังซ่อนอยู่” · ปุ่ม “ระบุเหตุผลเพื่อดู” / “ขอความยินยอม (ADD-C4)”', 'ป๊อปอัปส่งต่อ: Health Link consent ก่อน “ยืนยันส่งต่อ”'],
  conds: [
    ['ลงนาม ADD-C4 แล้ว', 'แสดงข้อมูลข้ามศูนย์ + “ผู้รับบริการยินยอม ADD-C4 แล้ว…”', null],
    ['ยังไม่ลงนาม · ข้อมูลทั่วไป', 'กด “ระบุเหตุผลเพื่อดู” → “ขอดูข้อมูลจากศูนย์อื่น” → “ยืนยันและเปิดดู”', null],

    ['ส่งต่อภายนอก + ไม่ยินยอม Health Link', '“ไม่ยินยอม = ส่งต่อไปสถานพยาบาลภายนอกสำนักอนามัยไม่ได้”', null],

  errors: [], store: ['mih:add-c4-consent:v1'], gaps: [], next: [],

/* ════════════════════════════ RENDER ════════════════════════════ */
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s);
let current = MODULES[0].key;
let order = [];           // ลำดับขั้นของโมดูลปัจจุบัน (สำหรับ ก่อนหน้า/ถัดไป)
let openId = null;

function stepNo(id) { const i = order.indexOf(id); return i < 0 ? id : `ขั้น ${i + 1} · ${id}`; }

function renderTabs() {
  $('#tabs').innerHTML = MODULES.map((m) => {
    const n = new Set(m.lanes.flatMap((l) => l.phases.flatMap((p) => p.nodes))).size;
    return `<button class="tab" role="tab" aria-selected="${m.key === current}" data-k="${m.key}">${m.label}<span class="n">${n} ขั้น</span></button>`;
  }).join('');
  $('#tabs').querySelectorAll('.tab').forEach((b) => b.onclick = () => { closeDrawer(); current = b.dataset.k; location.hash = current; render(); });
}

function nodeHtml(id) {
  const s = STEPS[id];
  const shot = s.shots[0];
  const nCond = s.conds.length;
  const nGap = s.gaps.length;
  return `<button class="node${s.alt ? ' alt' : ''}" data-id="${id}" aria-label="${s.title}">
    <div class="thumb${shot ? '' : ' none'}">${shot ? `<img loading="lazy" src="${S(shot[0])}" alt="">` : 'ไม่มีภาพหน้าจอ (ทำงานเบื้องหลัง)'}</div>
    <div class="body">
      <div class="no">${stepNo(id)}</div>
      <div class="t">${s.title}</div>
      <div class="r">${s.route}</div>
      <div class="badges">
        ${s.shots.length > 1 ? `<span class="b shots">${s.shots.length} ภาพ</span>` : ''}
        ${nCond ? `<span class="b cond">${nCond} เงื่อนไข</span>` : ''}
        ${nGap ? `<span class="b gap">${nGap} ข้อสังเกต</span>` : ''}
        ${s.alt ? '<span class="b alt">ทางเลือก</span>' : ''}
      </div>
    </div>
  </button>`;
}

function render() {
  const m = MODULES.find((x) => x.key === current);
  order = [...new Set(m.lanes.flatMap((l) => l.phases.flatMap((p) => p.nodes)))];
  renderTabs();
  $('#intro').innerHTML = `<div><h2>${m.title}</h2><p>${m.summary}</p></div>
    <div class="legend"><span><i class="dot" style="background:var(--c-info)"></i>มีเงื่อนไขแยกทาง</span><span><i class="dot" style="background:var(--c-danger)"></i>ข้อสังเกตจากโค้ด</span><span>กรอบเส้นประ = ทางเลือก/หน้ารอง</span></div>`;
  $('#flow').innerHTML = m.lanes.map((l) => `
    <section class="lane">
      <div class="lane-h"><h3>${l.title}</h3><span class="who">${l.who}</span></div>
      <div class="phases">${l.phases.map((p, i) => `
        ${i ? '<div class="arrow" aria-hidden="true">→</div>' : ''}
        <div class="phase"><div class="phase-h">${p.h}</div><div class="nodes">${p.nodes.map(nodeHtml).join('')}</div></div>`).join('')}
      </div>
    </section>`).join('');
  $('#flow').querySelectorAll('.node').forEach(bindNode);
}

/* ── hover preview: เฉพาะอุปกรณ์ที่มีเมาส์ ── */
const canHover = matchMedia('(hover: hover) and (pointer: fine)').matches;
const peek = $('#peek');
function bindNode(el) {
  el.onclick = () => openDrawer(el.dataset.id);
  if (!canHover) return;
  el.onmouseenter = () => showPeek(el);
  el.onmouseleave = () => peek.classList.remove('on');
  el.onfocus = () => showPeek(el);
  el.onblur = () => peek.classList.remove('on');
}
function showPeek(el) {
  const s = STEPS[el.dataset.id];
  const shot = s.shots[0];
  const branches = s.conds.filter((c) => c[2]).length;
  peek.innerHTML = `${shot ? `<img src="${S(shot[0])}" alt="">` : ''}
    <div class="pt">${s.title}</div><div class="ps">${s.summary}</div><hr>
    <dl class="kv"><dt>Route</dt><dd class="mono">${s.route}</dd><dt>ผู้ใช้</dt><dd>${s.who}</dd>
    <dt>เงื่อนไข</dt><dd>${s.conds.length} ข้อ · แยกไปขั้นอื่น ${branches}</dd>${s.shots.length > 1 ? `<dt>ภาพ</dt><dd>${s.shots.map((x) => x[1]).join(' · ')}</dd>` : ''}</dl>
    <div class="hint">คลิกเพื่อดูรายละเอียดทั้งหมด</div>`;
  const r = el.getBoundingClientRect();
  const w = Math.min(440, innerWidth - 24);
  let x = r.right + 12; if (x + w > innerWidth - 12) x = r.left - w - 12; if (x < 12) x = 12;
  peek.style.left = x + 'px';
  peek.style.top = '12px';
  peek.classList.add('on');
  requestAnimationFrame(() => {
    const h = peek.offsetHeight;
    let y = r.top; if (y + h > innerHeight - 12) y = innerHeight - h - 12; if (y < 12) y = 12;
    peek.style.top = y + 'px';
  });
}

/* ── drawer ── */
function list(items) { return `<ul>${items.map((x) => `<li>${x}</li>`).join('')}</ul>`; }
function openDrawer(id) {
  const s = STEPS[id]; if (!s) return;
  if (!order.includes(id)) { const m = MODULES.find((mm) => mm.lanes.some((l) => l.phases.some((p) => p.nodes.includes(id)))); if (m) { current = m.key; render(); } }
  openId = id;
  peek.classList.remove('on');
  document.querySelectorAll('.node').forEach((n) => n.classList.toggle('active', n.dataset.id === id));
  $('#d-no').textContent = stepNo(id);
  $('#d-title').textContent = s.title;
  $('#d-sum').textContent = s.summary;
  const i = order.indexOf(id);
  $('#d-prev').disabled = i <= 0; $('#d-next').disabled = i < 0 || i >= order.length - 1;
  const gal = s.shots.length ? `<section class="gallery sec"><h4>หน้าจอ</h4>${s.shots.length > 1 ? `<div class="variants">${s.shots.map((x, k) => `<button class="pill" aria-pressed="${k === 0}" data-k="${k}">${x[1]}</button>`).join('')}</div>` : ''}
      <div class="main"><img id="d-img" src="${S(s.shots[0][0])}" alt="${s.shots[0][1]}"></div><div class="cap" id="d-cap">${s.shots[0][1]} · คลิกภาพเพื่อขยาย</div></section>` : '';
  const tbl = s.table ? `<section class="sec"><h4>ตารางอ้างอิง</h4><div class="tbl-wrap"><table><thead><tr>${s.table.h.map((h) => `<th>${h}</th>`).join('')}</tr></thead><tbody>${s.table.rows.map((r) => `<tr>${r.map((c) => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div></section>` : '';
  const conds = s.conds.length ? `<section class="sec"><h4>เงื่อนไขและการทำงาน</h4><p class="hint">ถ้า … → ระบบทำอะไร → ไปขั้นไหนต่อ</p><div class="tbl-wrap"><table class="ct"><thead><tr><th>เงื่อนไข / การกระทำ</th><th>ผลลัพธ์</th><th>ไปต่อ</th></tr></thead><tbody>
      ${s.conds.map((c) => `<tr><td>${c[0]}</td><td>${c[1]}</td><td>${c[2] ? `<button class="go" data-go="${c[2]}">${c[2]} · ${STEPS[c[2]].title.slice(0, 22)}${STEPS[c[2]].title.length > 22 ? '…' : ''} →</button>` : '—'}</td></tr>`).join('')}</tbody></table></div></section>` : '';
  $('#d-body').innerHTML = `
    <section class="sec"><dl class="meta"><dt>Route</dt><dd class="mono">${s.route}</dd><dt>ผู้ใช้</dt><dd>${s.who}</dd><dt>ไฟล์</dt><dd class="mono">${s.file}</dd>
      ${s.next.length ? `<dt>ขั้นถัดไปปกติ</dt><dd>${s.next.map((n) => `<button class="go pill" data-go="${n}">${n} · ${STEPS[n].title}</button>`).join(' ')}</dd>` : ''}</dl></section>
    ${gal}
    <section class="sec"><h4>องค์ประกอบบนหน้าจอ</h4>${list(s.screen)}</section>
    ${tbl}${conds}
    ${s.errors.length ? `<section class="sec"><h4>ข้อความแจ้งเตือน / validation</h4>${list(s.errors.map((e) => `<span class="q">${/[“"]/.test(e) ? e : '“' + e + '”'}</span>`))}</section>` : ''}
    ${s.store.length ? `<section class="sec"><h4>ที่เก็บข้อมูล</h4>${list(s.store.map((x) => `<code>${x}</code>`))}</section>` : ''}
    ${s.gaps.length ? `<section class="sec gaps"><h4>ข้อสังเกตจากโค้ด (Dev ต้องตัดสินใจ/แก้)</h4>${list(s.gaps)}</section>` : ''}`;
  $('#d-body').scrollTop = 0;
  $('#d-body').querySelectorAll('[data-go]').forEach((b) => b.onclick = () => openDrawer(b.dataset.go));
  $('#d-body').querySelectorAll('.variants .pill').forEach((b) => b.onclick = () => {
    const x = s.shots[+b.dataset.k];
    $('#d-img').src = S(x[0]); $('#d-cap').textContent = x[1] + ' · คลิกภาพเพื่อขยาย';
    $('#d-body').querySelectorAll('.variants .pill').forEach((p) => p.setAttribute('aria-pressed', p === b));
  });
  const main = $('#d-body .gallery .main'); if (main) main.onclick = () => { $('#lb-img').src = $('#d-img').src; $('#lb').classList.add('on'); };
  $('#drawer').classList.add('on'); $('#scrim').classList.add('on');
  history.replaceState(null, '', `#${current}/${id}`);
  $('#d-close').focus();
}
function closeDrawer() {
  $('#drawer').classList.remove('on'); $('#scrim').classList.remove('on'); openId = null;
  document.querySelectorAll('.node.active').forEach((n) => n.classList.remove('active'));
  history.replaceState(null, '', `#${current}`);
}
$('#d-close').onclick = closeDrawer;
$('#scrim').onclick = closeDrawer;
$('#lb').onclick = () => $('#lb').classList.remove('on');
$('#d-prev').onclick = () => { const i = order.indexOf(openId); if (i > 0) openDrawer(order[i - 1]); };
$('#d-next').onclick = () => { const i = order.indexOf(openId); if (i >= 0 && i < order.length - 1) openDrawer(order[i + 1]); };
addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { if ($('#lb').classList.contains('on')) $('#lb').classList.remove('on'); else closeDrawer(); }
  if (!openId) return;
  if (e.key === 'ArrowRight') $('#d-next').click();
  if (e.key === 'ArrowLeft') $('#d-prev').click();
});

/* deep link: #login · #admin/A6 · #consent/S1 */
const [hk, hid] = location.hash.slice(1).split('/');
if (MODULES.some((m) => m.key === hk)) current = hk;
render();
if (hid && STEPS[hid]) openDrawer(hid);
</script>
</body>
