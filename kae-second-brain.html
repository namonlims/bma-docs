      blocks: [
        { t: 'จำนวนต่อเดือน', bars: [['ก.ย. 69', 35], ['ต.ค. 69', 267], ['พ.ย. 69', 191]] },
        { t: 'ล่าสุด', chips: ['2026-11-27-edocument-central-admin-only', '2026-11-27-github-actions-minutes-archive-cleanup', '2026-11-27-sitemap-from-mel-plus-clinics', '2026-11-26-consent-idcard-mismatch-error'] },
        { t: 'ใครเขียน · ใครอ่าน', rows: [['เขียน', 'skill handoff หลังงานที่ push แล้ว'], ['อ่าน', 'Glokbot · เซสชันถัดไป'], ['attachments/', 'ภาพประกอบ handoff']] }
      ] },

    { id: 'memory', group: 'สำรองของ Claude · ไฟล์ระบบ', name: 'claude-memory/', path: 'claude-memory/', n: '440', desc: 'สำรอง memory',
      sum: 'สำเนา memory ของ Claude บนเครื่องนี้ ให้เซสชัน cloud ใช้',
      blocks: [ { t: 'รายละเอียด', rows: [['ซิงก์', 'tools/sync-claude-memory.sh push'], ['ข้างใน', 'README.md · bma.health-main/']] } ] },
    { id: 'skills', group: 'สำรองของ Claude · ไฟล์ระบบ', name: 'claude-skills/', path: 'claude-skills/', n: '16 skill', desc: 'submodule',
      sum: 'submodule ชี้ไป repo namonlims/claude-skills',
      blocks: [ { t: 'skill ที่สำรอง', chips: ['handoff', 'cc-handoff', 'responsive-web', 'vibe-to-figma', 'figma-layer-rename', 'kiosk-360-face-scan', 'prototype', 'grill-me', 'grill-with-docs', 'improve-codebase-architecture', 'write-a-skill', 'write-beats', 'writing-fragments', 'writing-shape', 'caveman', '_global'] } ] },
    { id: 'system', group: 'สำรองของ Claude · ไฟล์ระบบ', name: 'raw/ · templates/ · tools/', path: 'raw/', n: '7 · 5 · 3', desc: 'ต้นฉบับ · แม่แบบ · สคริปต์',
      sum: 'ไฟล์ต้นฉบับ แม่แบบหน้า และสคริปต์ดูแลวอลต์',
      blocks: [ { t: 'รายละเอียด', rows: [['raw/', 'ต้นฉบับห้ามแก้ · ส่วนใหญ่อยู่ใน .gitignore · บนเครื่องมี S038 · S054 · S055'], ['templates/', 'concept · design-brief · entity · module · source'], ['tools/', 'lint.py · sync-claude-memory.sh · responsive-sweep'], ['.github/', 'workflow agents-md.yml']] } ] }
  ];

  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  var tree = document.getElementById('kb-tree'), panel = document.getElementById('kb-panel'), explorer = document.getElementById('kb-explorer'), q = document.getElementById('kb-q');
  var mobile = matchMedia('(max-width: 767px)');
  var current = 'index', term = '';

  var hit = function (text) { return term && String(text).toLowerCase().indexOf(term) > -1; };
  var countHits = function (f) {
    var n = 0;
    f.blocks.forEach(function (b) {
      (b.chips || []).forEach(function (c) { if (hit(c)) n++; });
      (b.rows || []).forEach(function (r) { if (hit(r[0]) || hit(r[1])) n++; });
    });
    if (!n && (hit(f.name) || hit(f.sum))) n = 1;
    return n;
  };

  var renderTree = function () {
    var groups = [], by = {};
    FOLDERS.forEach(function (f) { if (!by[f.group]) { by[f.group] = []; groups.push(f.group); } by[f.group].push(f); });
    tree.innerHTML = groups.map(function (g) {
      return '<div class="kb-tgroup"><h3 class="nd-group-title">' + esc(g) + '</h3><ul>' + by[g].map(function (f) {
        return '<li data-id="' + f.id + '"><button type="button" class="kb-titem" role="tab" id="t-' + f.id + '" aria-controls="kb-panel" aria-selected="false">' +
          '<span class="t-name">' + esc(f.name) + '</span><span class="t-desc">' + esc(f.desc) + '</span>' +
          '<span class="t-n"><span class="t-count">' + esc(f.n) + '</span><span class="t-hit"></span></span></button></li>';
      }).join('') + '</ul></div>';
    }).join('');
  };

  var renderPanel = function (f) {
    var crumb = ['bma-health-second-brain'].concat(f.path.replace(/\/$/, '').split('/'));
    var html = '<div class="kb-crumb">' + crumb.map(function (c, i) { return i === crumb.length - 1 ? '<b>' + esc(c) + '</b>' : esc(c) + ' /'; }).join(' ') + '</div>' +
      '<div class="kb-phead"><div class="kb-ptitle"><h3>' + esc(f.name) + '</h3><span class="nd-chip nd-chip--brand">' + esc(f.n) + '</span></div><p>' + esc(f.sum) + '</p></div>';
    f.blocks.forEach(function (b) {
      html += '<div class="kb-grp"><h4 class="nd-group-title">' + esc(b.t) + '</h4>';
      if (b.chips) html += '<div class="kb-tags">' + b.chips.map(function (c) { return '<span class="nd-chip' + (hit(c) ? ' is-hit' : '') + '">' + esc(c) + '</span>'; }).join('') + '</div>';
      if (b.rows) html += '<dl class="kb-rows">' + b.rows.map(function (r) { return '<dt' + (hit(r[0]) || hit(r[1]) ? ' class="is-hit"' : '') + '>' + esc(r[0]) + '</dt><dd>' + esc(r[1]) + '</dd>'; }).join('') + '</dl>';
      if (b.bars) { var max = Math.max.apply(null, b.bars.map(function (x) { return x[1]; })); html += '<div class="kb-bars">' + b.bars.map(function (x) { return '<div class="kb-bar"><span>' + esc(x[0]) + '</span><span class="track"><span class="fill" style="width:' + (x[1] / max * 100).toFixed(1) + '%"></span></span><span class="v">' + x[1] + '</span></div>'; }).join('') + '</div>'; }
      html += '</div>';
    });
    panel.innerHTML = html;
    panel.setAttribute('aria-labelledby', 't-' + f.id);
  };

  /* มือถือ: แผงไปอยู่ใต้รายการที่เลือก · จอใหญ่: แผงอยู่ขวา */
  var placePanel = function () {
    if (mobile.matches) { var li = tree.querySelector('li[data-id="' + current + '"]'); if (li) li.appendChild(panel); }
    else if (panel.parentNode !== explorer) explorer.appendChild(panel);
  };

  var select = function (id, opts) {
    var f = FOLDERS.filter(function (x) { return x.id === id; })[0]; if (!f) return;
    /* มือถือ: กดโฟลเดอร์ที่เปิดอยู่ซ้ำ = พับ (เปิดทีละอัน) */
    if (mobile.matches && opts && opts.user && id === current && !panel.hidden) { panel.hidden = true; tree.querySelector('#t-' + id).setAttribute('aria-expanded', 'false'); return; }
    current = id; panel.hidden = false;
    tree.querySelectorAll('.kb-titem').forEach(function (b) { var on = b.id === 't-' + id; b.setAttribute('aria-selected', String(on)); b.tabIndex = on ? 0 : -1; b.setAttribute('aria-expanded', String(on)); });
    renderPanel(f); placePanel();
    try { sessionStorage.setItem('kb-folder', id); } catch (e) {}
  };

  var applyFilter = function () {
    term = q.value.trim().toLowerCase();
    explorer.classList.toggle('is-filtering', !!term);
    var first = null, any = false;
    FOLDERS.forEach(function (f) {
      var n = term ? countHits(f) : 1, li = tree.querySelector('li[data-id="' + f.id + '"]');
      li.classList.toggle('kb-hide', !n);
      li.querySelector('.t-hit').textContent = n ? 'พบ ' + n : '';
      if (n) { any = true; if (!first) first = f.id; }
    });
    tree.querySelectorAll('.kb-tgroup').forEach(function (g) { g.classList.toggle('kb-hide', !g.querySelector('li:not(.kb-hide)')); });
    if (!any) { panel.hidden = false; explorer.appendChild(panel); panel.innerHTML = '<p class="kb-empty">ไม่พบหน้าที่ตรงกับ "' + esc(q.value.trim()) + '" ลองคำอื่น เช่น pharmacy หรือ anc</p>'; return; }
    var curLi = tree.querySelector('li[data-id="' + current + '"]');
    select(term && curLi.classList.contains('kb-hide') ? first : current);
  };

  renderTree();
  tree.addEventListener('click', function (e) { var b = e.target.closest('.kb-titem'); if (b) select(b.id.slice(2), { user: true }); });
  tree.addEventListener('keydown', function (e) {
    if (['ArrowDown', 'ArrowUp', 'Home', 'End'].indexOf(e.key) < 0) return;
    var items = [].slice.call(tree.querySelectorAll('li:not(.kb-hide) .kb-titem')), i = items.indexOf(document.activeElement); if (i < 0) return;
    e.preventDefault();
    var n = e.key === 'Home' ? 0 : e.key === 'End' ? items.length - 1 : (i + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length;
    items[n].focus(); select(items[n].id.slice(2));
  });
  q.addEventListener('input', applyFilter);
  (mobile.addEventListener ? mobile.addEventListener.bind(mobile, 'change') : mobile.addListener.bind(mobile))(placePanel);
  var saved = null; try { saved = sessionStorage.getItem('kb-folder'); } catch (e) {}
  select(saved && FOLDERS.some(function (f) { return f.id === saved; }) ? saved : 'index');
})();
</script>
