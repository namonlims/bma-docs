  var readFile = function (path, keepFolder) {
    var fid = folderOf(path);
    if (!keepFolder && fid !== current) { selectFolder(fid, { silent: true }); }
    if (!token) { openFile = null; showConnect(null, 'file', path); return; }
    openFile = path; save();
    var f = FOLDERS.filter(function (x) { return x.id === current; })[0];
    var back = f.single ? '' : '<button type="button" class="nd-btn" id="kb-back">‹ กลับไป ' + esc(f.name) + '</button>';
    var head = '<div class="kb-readbar">' + back + '<a class="nd-btn kb-btn-ghost" href="' + WEB + path.split('/').map(encodeURIComponent).join('/') + '" target="_blank" rel="noopener">เปิดใน GitHub ↗</a></div>' + crumbHtml(path);
    panel.innerHTML = head + '<p class="kb-msg">กำลังโหลด ' + esc(base(path)) + '…</p>';
    var p = cache[path] ? Promise.resolve(cache[path]) : gh('/contents/' + path.split('/').map(encodeURIComponent).join('/') + '?ref=' + BRANCH, true).then(function (t) { cache[path] = t; return t; });
    p.then(function (txt) {
      if (openFile !== path) return;
      if (!isMd(path)) { panel.innerHTML = head + '<div class="kb-phead"><div class="kb-ptitle"><h3>' + esc(base(path)) + '</h3></div></div><pre class="kb-md" style="white-space:pre-wrap"><code>' + esc(txt) + '</code></pre>'; return; }
      var r = renderMd(path, txt);
      panel.innerHTML = head + '<div class="kb-phead"><div class="kb-ptitle"><h3>' + esc(shortName(path)) + '</h3></div></div>' + r.meta + '<article class="kb-md">' + r.html + '</article>';
    }).catch(function (e) {
      if (openFile !== path) return;
      if (e && (e.kind === 'auth' || e.kind === 'access')) { showConnect(errText(e), 'file', path); return; }
      panel.innerHTML = head + '<p class="kb-msg is-err">' + esc(errText(e)) + '</p>';
    });
    if (!mobile.matches) explorer.scrollIntoView({ block: 'nearest' });
  };

  /* ── เลือกโฟลเดอร์ ── */
  var placePanel = function () {
    if (mobile.matches && !explorer.classList.contains('is-full')) { var li = tree.querySelector('li[data-id="' + current + '"]'); if (li) li.appendChild(panel); }
    else if (panel.parentNode !== explorer) explorer.appendChild(panel);
  };
  var save = function () { try { sessionStorage.setItem('kb-view', JSON.stringify({ folder: current, file: openFile })); } catch (e) {} };
  var selectFolder = function (id, opts) {
    var f = FOLDERS.filter(function (x) { return x.id === id; })[0]; if (!f) return;
    opts = opts || {};
    if (mobile.matches && opts.user && id === current && !panel.hidden && !openFile) { panel.hidden = true; tree.querySelector('#t-' + id).setAttribute('aria-expanded', 'false'); return; }
    current = id; panel.hidden = false; openFile = null;
    tree.querySelectorAll('.kb-titem').forEach(function (b) { var on = b.id === 't-' + id; b.setAttribute('aria-selected', String(on)); b.tabIndex = on ? 0 : -1; b.setAttribute('aria-expanded', String(on)); });
    placePanel();
    if (opts.silent) return;
    if (f.single && token) { readFile(f.single, true); return; }
    renderFolder(f); save();
  };

  /* ── เหตุการณ์ ── */
  tree.addEventListener('click', function (e) { var b = e.target.closest('.kb-titem'); if (b) selectFolder(b.id.slice(2), { user: true }); });
  tree.addEventListener('keydown', function (e) {
    if (!e.target.classList.contains('kb-titem') || ['ArrowDown', 'ArrowUp', 'Home', 'End'].indexOf(e.key) < 0) return;
    var items = [].slice.call(tree.querySelectorAll('li:not(.kb-hide) > .kb-titem')), i = items.indexOf(e.target); if (i < 0) return;
    e.preventDefault();
    var n = e.key === 'Home' ? 0 : e.key === 'End' ? items.length - 1 : (i + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length;
    items[n].focus(); selectFolder(items[n].id.slice(2));
  });
  panel.addEventListener('click', function (e) {
    var fb = e.target.closest('.kb-file'); if (fb) { readFile(fb.getAttribute('data-path'), true); return; }
    var w = e.target.closest('a[data-wiki]'); if (w) { e.preventDefault(); var p = w.getAttribute('data-wiki'); if (p) readFile(p); return; }
    if (e.target.closest('#kb-back')) { selectFolder(current); }
  });
  /* เดือนของ handoff เปิดทีละเดือน */
  panel.addEventListener('toggle', function (e) {
    var d = e.target; if (!d.classList || !d.classList.contains('kb-month') || !d.open || term) return;
    panel.querySelectorAll('.kb-month[open]').forEach(function (o) { if (o !== d) o.open = false; });
  }, true);
  q.addEventListener('input', function () {
    term = q.value.trim().toLowerCase();
    var any = updateCounts();
    if (!any) { if (panel.parentNode !== explorer) explorer.appendChild(panel); panel.hidden = false; panel.innerHTML = '<p class="kb-msg">ไม่พบไฟล์ที่ชื่อมี "' + esc(q.value.trim()) + '" ลองคำอื่น เช่น pharmacy หรือ anc</p>'; return; }
    var li = tree.querySelector('li[data-id="' + current + '"]');
    if (term && li.classList.contains('kb-hide')) current = tree.querySelector('li:not(.kb-hide)').getAttribute('data-id');
    var f = FOLDERS.filter(function (x) { return x.id === current; })[0];
    if (f.single && term) { selectFolder(current, { silent: true }); renderFolder(f); } else selectFolder(current);
  });
  $('kb-refresh').addEventListener('click', function () { sync(); });
  $('kb-logout').addEventListener('click', function () {
    try { localStorage.removeItem(TOKEN_KEY); } catch (e) {}
    token = null; cache = {}; openFile = null; setStatus(); selectFolder(current);
  });
  (mobile.addEventListener ? mobile.addEventListener.bind(mobile, 'change') : mobile.addListener.bind(mobile))(placePanel);

  setStatus(); loadSnapshot();
})();
</script>
<script src="docs-frame.js"></script>
</body>
